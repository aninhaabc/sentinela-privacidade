<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentinela de Privacidade</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">ANÁLISE DA PÁGINA</p>
          <h1>Sentinela de Privacidade</h1>
        </div>
        <span class="status" aria-label="Extensão ativa">Ativa</span>
      </header>

      <section class="page-card" aria-labelledby="page-title">
        <h2 id="page-title">Página atual</h2>
        <p id="page-name" class="page-name">Carregando...</p>
        <p id="page-url" class="page-url"></p>
      </section>

      <p id="scan-status" class="scan-status" aria-live="polite"></p>

      <section class="metrics" aria-label="Resumo das conexões">
        <article class="metric-card">
          <span class="metric-label">Requisições observadas</span>
          <strong id="total-requests" class="metric-value">0</strong>
        </article>
        <article class="metric-card metric-card--warning">
          <span class="metric-label">Requisições de terceiros</span>
          <strong id="third-party-requests" class="metric-value">0</strong>
        </article>
      </section>

      <section class="domains-card" aria-labelledby="domains-title">
        <div class="domains-header">
          <h2 id="domains-title">Domínios de terceiros</h2>
          <span id="domain-count" class="domain-count">0</span>
        </div>
        <ul id="domain-list" class="domain-list">
          <li class="domain-empty">Nenhum domínio observado.</li>
        </ul>
      </section>

      <section class="cookies-card" aria-labelledby="cookies-title">
        <div class="domains-header">
          <h2 id="cookies-title">Cookies injetados</h2>
          <span id="cookie-total" class="domain-count">0</span>
        </div>
        <div class="cookie-grid">
          <div><span>Primeira parte</span><strong id="first-party-cookies">0</strong></div>
          <div><span>Terceira parte</span><strong id="third-party-cookies">0</strong></div>
          <div><span>Sessão</span><strong id="session-cookies">0</strong></div>
          <div><span>Persistentes</span><strong id="persistent-cookies">0</strong></div>
        </div>
      </section>

      <footer>
        <span>Versão 0.3.0</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
